# GitGuardian configuration
# Test documentation and example files - intentionally committed
# https://docs.gitguardian.com/ggshield-docs/configuration

version: 2
secret:
  ignored_paths:
  - bf-*.txt
  - docs/**
  - test_docs/**
  - examples/**
  - src/**/*.plating/**
  - keys/**
  - helpers/*/keys/**
  - helpers/*/configs/keys/**
  - tests/*/keys/**
  - tests/*/configs/keys/**
  - site/**
  - tests/**
