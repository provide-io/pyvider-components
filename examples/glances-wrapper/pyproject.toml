# FlavorPack manifest for Glances
# Glances is a Python-based system monitoring tool (similar to htop/btop)

[project]
name = "glances-portable"
version = "4.0.0"
description = "Glances system monitoring tool packaged with FlavorPack"
requires-python = ">=3.11"

# Glances core dependencies
dependencies = [
    "glances>=4.0.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
# Optional features for enhanced functionality
web = [
    "bottle>=0.12.0",
    "requests>=2.28.0",
]
export = [
    "influxdb-client>=1.36.0",
    "elasticsearch>=8.0.0",
    "cassandra-driver>=3.28.0",
]
graph = [
    "matplotlib>=3.7.0",
]

[tool.flavor]
package_name = "glances"
entry_point = "glances:main"

[tool.flavor.execution]
# Glances runs as an interactive TUI
command = "{workenv}/bin/glances"

[tool.flavor.execution.runtime.env]
# Security: Clear all environment variables by default
unset = ["*"]

# Pass essential system and terminal variables
pass = [
    # System essentials
    "PATH",
    "HOME",
    "USER",
    "HOSTNAME",

    # Terminal support (critical for TUI)
    "TERM",
    "COLORTERM",
    "TERMINFO",
    "TERMCAP",
    "LINES",
    "COLUMNS",

    # Locale/Language
    "LANG",
    "LC_*",

    # Glances-specific
    "GLANCES_*",
]

[tool.flavor.build]
# Include only necessary files
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    ".git/",
    "tests/",
    "docs/",
]

[tool.flavor.signing]
# Deterministic builds for reproducibility
key_seed = "glances-portable-v4"

# Performance and size optimization
[tool.flavor.optimization]
strip_binaries = true
compress_level = 6
