[project]
name = "sysinfo"
version = "1.0.0"
description = "System Information CLI Tool - packaged with FlavorPack"
authors = [{name = "FlavorPack Demo"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
sysinfo = "sysinfo:main"

[tool.flavor]
package_name = "sysinfo"
entry_point = "sysinfo:main"

[tool.flavor.metadata]
description = "System Information CLI - Single-file executable created with FlavorPack"
homepage = "https://github.com/provide-io/flavorpack"
tags = ["cli", "sysinfo", "demo"]

[tool.flavor.execution]
# Execution configuration - what command to run
command = "python"
args = ["-m", "sysinfo"]

[tool.flavor.execution.runtime.env]
# Environment variable configuration
unset = ["*"]  # Clear all environment variables by default
pass = [       # Except these essential ones
    "PATH",
    "HOME", 
    "USER",
    "SHELL",
    "TERM",
    "LANG",
    "LC_*"
]

[tool.flavor.build]
# No external dependencies - pure stdlib
dependencies = []

[tool.flavor.signing]
# Use deterministic key for demo purposes
# In production, use real keys: flavor keygen --output keys/
deterministic = true
