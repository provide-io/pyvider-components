INHERIT: .provide/foundry/base-mkdocs.yml
site_name: Pyvider Components
site_description: Learning and reference library for Pyvider framework components
site_author: provide.io
site_url: https://foundry.provide.io/pyvider-components/
repo_url: https://github.com/provide-io/pyvider-components
repo_name: provide-io/pyvider-components
edit_uri: edit/main/docs/
copyright: ©2024-2025 provide.io llc<br/>🛠️ with 💚 and 🦝 on 🌎
dev_addr: 127.0.0.1:11008
docs_dir: docs
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
nav:
- Overview: index.md
- Guides:
  - Orientation: guides/orientation.md
  - Build Your Own Provider: guides/build-your-own.md
