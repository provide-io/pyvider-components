# Inherit shared configuration from provide-foundry
INHERIT: ../provide-foundry/base-mkdocs.yml

# Project-Specific Configuration
site_name: Pyvider Components
site_description: 'Learning and reference library for Pyvider framework components'
site_author: provide.io
site_url: https://foundry.provide.io/pyvider-components/
repo_url: https://github.com/provide-io/pyvider-components
repo_name: provide-io/pyvider-components
edit_uri: edit/main/docs/
copyright: 'Copyright &copy; 2017 - 2025 Provide'

# Development server configuration
dev_addr: '127.0.0.1:8004'

# Standalone mode settings
docs_dir: docs

# Project-specific theme overrides
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
    # Light mode - custom colors for pyvider-components
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode - custom colors for pyvider-components
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Navigation Structure
nav:
  - 'Home': 'index.md'

  - 'Getting Started': 'getting-started.md'

  - 'How-To Guides':
      - 'Study Components': 'how-to/study-components.md'

  - 'Reference':
