[project]
name = "pyvider-components"
version = "0.0.0-1"
description = "Standard Components for the Pyvider Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvider-telemetry",
    "pyvider-rpcplugin",
    "attrs>=25.3.0",
    "httpx>=0.28.1",
    "jq>=1.9.1",
    "jinja2>=3.1.6",
    "pyvider-cty>=0.0.113",
    "pyvider>=0.0.0.post0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.garnish/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "grpc-stubs>=1.53.0.6",
    "grpcio-tools>=1.73.0",
    "hypothesis>=6.131.0",
    "mypy>=1.9.0",
    "psutil>=7.0.0",
    "pyright>=1.1.401",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
    "types-protobuf>=6.30.2.20250516",
    "memray>=1.17.2",
    "pytest-benchmark>=5.1.0",
]

[tool.uv.sources]
