#
# pyvider-components/pyproject.toml
#
# Standard Components for the Pyvider Framework
#

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvider-components"
dynamic = ["version"]
description = "Standard Components for the Pyvider Framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "provide-foundation>=0.4.3",
    "pyvider-rpcplugin>=0.4.2",
    "httpx>=0.28.1",
    "jq>=1.9.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "jinja2>=3.1.6",
    "pyvider-cty>=0.5.3",
    "pyvider>=0.6.2",
    "plating>=0.6.1",
]

[project.urls]
Homepage = "https://foundry.provide.io/pyvider-components/"
Documentation = "https://foundry.provide.io/pyvider-components/"
Repository = "https://foundry.provide.io/pyvider-components/repo"
Issues = "https://foundry.provide.io/pyvider-components/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
"*" = ["*.plating/**/*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "memray: memory profiling stress tests (run with -m memray)",
]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten.*:pytest.PytestAssertRewriteWarning",
]
addopts = "-m 'not memray'"
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv", "htmlcov", ".hypothesis", "tests/memray"]
# Parallel execution: pytest -n <workers> (range: 2-16, recommend: CPU cores or 8, max: 16 to avoid xdist hang)

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
# ruff >=0.16 formats Python code blocks embedded in Markdown; docs prose is
# not the formatter's to restyle, so Markdown files are excluded.
extend-exclude = [
    "**/*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "BLE", "C90", "PIE", "PLR", "S", "SIM", "PTH", "RUF"]
ignore = [
    "ANN401",   # any-type (too restrictive)
    "BLE001",   # blind-except (CLI error handlers legitimately catch Exception)
    "B008",     # function-call-in-default-argument (Click uses this pattern)
    "C901",     # complexity (scripts and CLI mains are legitimately complex)
    "E501",     # line-too-long (handled by formatter)
    "E741",     # ambiguous variable names (rare but intentional single-letter locals)
    "S101",     # assert (valid in tests)
    "S108",     # hardcoded-temp-file (/tmp is fine for our use cases)
    "S310",     # suspicious-url-open-for-protocol (URLs are controlled)
    "S603",     # subprocess-without-shell-equals-true (trusted input)
    "S607",     # start-process-with-partial-path (trusted executables)
    "PLR0911",  # too-many-return-statements (refactor later)
    "PLR0912",  # too-many-branches (refactor later)
    "PLR0913",  # too-many-arguments (common in config classes)
    "PLR0915",  # too-many-statements (refactor later)
    "PLR2004",  # magic-value-comparison (too noisy)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "BLE001", "E402", "S105", "S106", "S110", "S311", "SIM105", "PLR0124"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyvider.*", "jinja2.*", "rich.*", "click.*", "attrs.*", "httpx.*", "jq.*"]
ignore_missing_imports = true

[project.entry-points.pyvider]
pyvider-components = "pyvider.components"

[pyvider]
name = "pyvider"

[tool.plating]
provides_content = true

[dependency-groups]
dev = [
    "provide-testkit[standard,advanced-testing,build,profiling]>=0.4.0",
    "pyvider-rpcplugin[test]>=0.4.2",
]

[tool.coverage.run]
source = ["pyvider.components"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "workenv"]

################################################################################
# Security Scanning Allowlist
################################################################################

[tool.security]
# Paths to exclude from secret scanning (TruffleHog, GitGuardian, Gitleaks)
description = "Test documentation and example files - intentionally committed"
allowed_paths = [
    # Bfiles test output
    "bf-*.txt",
    # Generated documentation with example HCL
    "docs/**",
    "test_docs/**",
    # Terraform examples with test tfplan files
    "examples/**",
    # Plating template examples
    "src/**/*.plating/**",
    # Test signing keys
    "keys/**",
    "helpers/*/keys/**",
    "helpers/*/configs/keys/**",
    "tests/*/keys/**",
    "tests/*/configs/keys/**",
    # Built documentation site
    "site/**",
    # Test files
    "tests/**",
]

# No `[tool.uv.sources]`. Local sibling checkouts are installed with
# `uv pip install -e ../pyvider` rather than pinned as a path source here, so
# this file describes only what a published install resolves -- the same thing
# pyvider, pyvider-cty and tofusoup say, and for the same reason.
#
# It is not only a preference. The release workflow calls ci-tooling's
# `python-release.yml`, which has no `no-sources` input to pass, so a path source
# here fails the release outright: "Failed to generate package metadata for
# `pyvider @ ../pyvider`". That is exactly how tofusoup's first v0.5.0 attempt
# died.
